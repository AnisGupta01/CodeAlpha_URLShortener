<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener | CodeAlpha</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>URL Shortener</h1>
    <p class="sub">Paste a long link, get a short one.</p>

    <form id="shorten-form">
      <input id="url" type="url" placeholder="https://example.com/very/long/link" required>
      <input id="custom" type="text" placeholder="Custom code (optional)" maxlength="32">
      <button type="submit">Shorten</button>
    </form>

    <p id="error" class="error" hidden></p>

    <div id="result" class="result" hidden>
      <a id="short-link" target="_blank" rel="noopener"></a>
      <button id="copy" type="button">Copy</button>
    </div>

    <h2>Recent links</h2>
    <table>
      <thead><tr><th>Short</th><th>Original</th><th>Clicks</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
